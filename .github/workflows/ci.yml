name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Run test suite
        run: npm test

  manifest:
    name: manifest sanity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate JSON manifests
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            .agents/plugins/marketplace.json \
            plugins/cc/plugin.json \
            plugins/cc/.codex-plugin/plugin.json \
            plugins/cc/schemas/review-output.schema.json
          do
            node -e "JSON.parse(require('node:fs').readFileSync('$file','utf8'))"
            echo "ok: $file"
          done

      - name: Plugin versions match package version
        shell: bash
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          # Codex's local dev flow appends a +codex.<token> cachebuster; compare the prefix.
          root=$(node -p "require('./plugins/cc/plugin.json').version.split('+')[0]")
          codex=$(node -p "require('./plugins/cc/.codex-plugin/plugin.json').version.split('+')[0]")
          test "$pkg" = "$root" && test "$pkg" = "$codex" || {
            echo "version mismatch: package.json=$pkg plugin.json=$root .codex-plugin=$codex" >&2
            exit 1
          }
          echo "ok: $pkg"

      - name: Antigravity requires the manifest at the plugin root
        shell: bash
        run: |
          set -euo pipefail
          # `agy plugin validate` stats <root>/plugin.json and accepts nothing
          # else — it rejects both .codex-plugin/ and .claude-plugin/. agy is
          # not installable on a runner, so assert the shape it checks.
          test -f plugins/cc/plugin.json || { echo "missing plugins/cc/plugin.json" >&2; exit 1; }
          for skill in setup review adversarial-review; do
            test -f "plugins/cc/skills/$skill/SKILL.md" || {
              echo "missing skills/$skill/SKILL.md" >&2
              exit 1
            }
          done
          echo "ok: antigravity plugin layout"
